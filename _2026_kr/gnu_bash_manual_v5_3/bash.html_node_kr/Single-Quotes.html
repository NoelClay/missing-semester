<h4 class="subsubsection" id="Single-Quotes-1"><span>3.1.2.2 작은따옴표<a class="copiable-link" href="#Single-Quotes-1"> &para;</a></span></h4>

<p>문자들을 작은따옴표(&lsquo;<samp class="samp">'</samp>&rsquo;)로 감싸면 따옴표 내에 있는 각 문자의 리터럴 값이 그대로 보존됩니다.
작은따옴표 사이에는 백슬래시를 앞에 붙이더라도 또 다른 작은따옴표가 올 수 없습니다.
</p>

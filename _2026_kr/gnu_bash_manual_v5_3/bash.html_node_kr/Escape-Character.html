<h4 class="subsubsection" id="Escape-Character-1"><span>3.1.2.1 이스케이프 문자<a class="copiable-link" href="#Escape-Character-1"> &para;</a></span></h4>
<p>인용되지 않은 백슬래시 &lsquo;<samp class="samp">\</samp>&rsquo;는 Bash의 이스케이프 문자입니다.
이는 <code class="code">newline</code>(줄바꿈)을 제외하고, 바로 다음에 오는 문자가 가진 특별한 의미를 제거하여 그 문자의 리터럴 값을 보존합니다.
만약 <code class="code">&#92;newline</code> 쌍이 나타나고 백슬래시 자체가 인용되지 않았다면, <code class="code">&#92;newline</code>은 줄 이어짐(line continuation)으로 취급됩니다(즉, 입력 스트림에서 제거되어 사실상 무시됩니다).
</p>

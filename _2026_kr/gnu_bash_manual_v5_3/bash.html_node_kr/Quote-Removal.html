<h4 class="subsection" id="Quote-Removal-1"><span>3.5.9 따옴표 제거<a class="copiable-link" href="#Quote-Removal-1"> &para;</a></span></h4>

<p>이전의 모든 확장 과정이 끝난 후, 인용되지 않은 상태로 나타나는 문자 &lsquo;<samp class="samp">\</samp>&rsquo;, &lsquo;<samp class="samp">'</samp>&rsquo;, 그리고 &lsquo;<samp class="samp">&quot;</samp>&rsquo; 중에서 위의 확장 결과로 생겨난 것이 아닌 모든 것들은 제거됩니다.
